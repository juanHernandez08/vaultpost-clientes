# Conexión a la base de datos de Vaultpost (MySQL / MariaDB)
# Puede sobrescribirse con las variables VAULTPOST_DB_URL, VAULTPOST_DB_USER y VAULTPOST_DB_PASSWORD
db.driver=org.mariadb.jdbc.Driver
db.url=jdbc:mariadb://localhost:3306/vaultpost
db.user=vaultpost_app
db.password=vaultpost_app

# Agencia con la que trabaja el módulo (Orbital Media en los datos de prueba)
app.company.id=c0000000-0000-0000-0000-000000000001
